<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Management - BTGraphQL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/BTGraphQL/">🚀 BTGraphQL</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/BTGraphQL/">Home</a>
                <a class="nav-link" href="/BTGraphQL/users-html">Users</a>
                <a class="nav-link" href="/BTGraphQL/categories-html">Categories</a>
                <a class="nav-link active" href="/BTGraphQL/products-html">Products</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2>🛍️ Products Management</h2>
                
                <div class="card mb-4">
                    <div class="card-body">
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProductModal">
                            ➕ Add Product
                        </button>
                        <button class="btn btn-success" onclick="loadProducts()">
                            🔄 Refresh
                        </button>
                        <button class="btn btn-info" onclick="loadProductsByPriceAsc()">
                            💰 Sort by Price (Low to High)
                        </button>
                    </div>
                </div>

                <div id="loading" class="text-center" style="display: none;">
                    <div class="spinner-border" role="status"></div>
                    <p>Loading products...</p>
                </div>

                <div id="messages"></div>

                <div class="card">
                    <div class="card-body">
                        <div id="productsTable">
                            <p class="text-muted">Click "Refresh" to load products</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="addProductForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="productTitle" class="form-label">Product Title *</label>
                            <input type="text" class="form-control" id="productTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="productPrice" class="form-label">Price *</label>
                            <input type="number" step="0.01" class="form-control" id="productPrice" required>
                        </div>
                        <div class="mb-3">
                            <label for="productQuantity" class="form-label">Quantity</label>
                            <input type="number" class="form-control" id="productQuantity" value="1">
                        </div>
                        <div class="mb-3">
                            <label for="productDesc" class="form-label">Description</label>
                            <textarea class="form-control" id="productDesc" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="productUserId" class="form-label">User ID *</label>
                            <input type="number" class="form-control" id="productUserId" required>
                            <div class="form-text">Enter the ID of the user who owns this product</div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">💾 Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const CONTEXT_PATH = '/BTGraphQL';
        
        async function executeGraphQL(query, variables = {}) {
            try {
                const response = await fetch(`${CONTEXT_PATH}/graphql`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, variables })
                });
                
                const result = await response.json();
                if (result.errors) throw new Error(result.errors[0].message);
                return result.data;
            } catch (error) {
                console.error('GraphQL Error:', error);
                throw error;
            }
        }

        function showMessage(message, type = 'info') {
            const messagesDiv = document.getElementById('messages');
            const alertClass = type === 'error' ? 'alert-danger' : 'alert-success';
            messagesDiv.innerHTML = `<div class="alert ${alertClass} alert-dismissible fade show" role="alert">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>`;
            setTimeout(() => messagesDiv.innerHTML = '', 5000);
        }

        async function loadProducts() {
            try {
                document.getElementById('loading').style.display = 'block';
                
                const query = `
                    query {
                        products {
                            id
                            title
                            quantity
                            desc
                            price
                            user {
                                id
                                fullname
                            }
                        }
                    }
                `;
                
                const data = await executeGraphQL(query);
                displayProducts(data.products || [], 'All Products');
                
            } catch (error) {
                showMessage('Failed to load products: ' + error.message, 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function loadProductsByPriceAsc() {
            try {
                document.getElementById('loading').style.display = 'block';
                
                const query = `
                    query {
                        productsByPriceAsc {
                            id
                            title
                            quantity
                            desc
                            price
                            user {
                                id
                                fullname
                            }
                        }
                    }
                `;
                
                const data = await executeGraphQL(query);
                displayProducts(data.productsByPriceAsc || [], 'Products Sorted by Price (Low to High)');
                
            } catch (error) {
                showMessage('Failed to load products by price: ' + error.message, 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayProducts(products, title = 'Products') {
            if (!products || products.length === 0) {
                document.getElementById('productsTable').innerHTML = `
                    <div class="alert alert-info">
                        <h5>📭 No products found</h5>
                        <p>Click "Add Product" to create your first product.</p>
                    </div>
                `;
                return;
            }
            
            let html = `
                <h5>${title}</h5>
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>🛍️ Title</th>
                            <th>💰 Price</th>
                            <th>📦 Quantity</th>
                            <th>📝 Description</th>
                            <th>👤 Owner</th>
                            <th>⚡ Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            products.forEach(product => {
                const title = product.title || 'N/A';
                const price = product.price || 0;
                const quantity = product.quantity || 0;
                const desc = product.desc || 'No description';
                const owner = product.user ? product.user.fullname : 'Unknown';
                
                html += `
                    <tr>
                        <td><strong>${title}</strong></td>
                        <td><span class="badge bg-success">$${parseFloat(price).toFixed(2)}</span></td>
                        <td><span class="badge bg-info">${quantity}</span></td>
                        <td>${desc.length > 50 ? desc.substring(0, 50) + '...' : desc}</td>
                        <td>${owner}</td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="deleteProduct('${product.id}', '${title}')">
                                🗑️ Delete
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            document.getElementById('productsTable').innerHTML = html;
        }

        async function addProduct(event) {
            event.preventDefault();
            
            try {
                const title = document.getElementById('productTitle').value.trim();
                const price = parseFloat(document.getElementById('productPrice').value);
                const quantity = parseInt(document.getElementById('productQuantity').value) || 1;
                const desc = document.getElementById('productDesc').value.trim() || null;
                const userId = parseInt(document.getElementById('productUserId').value);
                
                if (!title || !price || !userId) {
                    showMessage('Please fill in all required fields!', 'error');
                    return;
                }
                
                const mutation = `
                    mutation($input: ProductInput!) {
                        createProduct(input: $input) {
                            id
                            title
                            price
                            quantity
                            desc
                            user {
                                fullname
                            }
                        }
                    }
                `;
                
                const data = await executeGraphQL(mutation, {
                    input: { title, price, quantity, desc, userId }
                });
                
                if (data?.createProduct) {
                    showMessage(`✅ Product "${data.createProduct.title}" created successfully!`, 'success');
                    bootstrap.Modal.getInstance(document.getElementById('addProductModal')).hide();
                    document.getElementById('addProductForm').reset();
                    await loadProducts();
                }
                
            } catch (error) {
                showMessage('Failed to create product: ' + error.message, 'error');
            }
        }

        async function deleteProduct(productId, productTitle) {
            if (!confirm(`Are you sure you want to delete "${productTitle}"?`)) return;
            
            try {
                const mutation = `
                    mutation($id: ID!) {
                        deleteProduct(id: $id)
                    }
                `;
                
                const data = await executeGraphQL(mutation, { id: productId });
                
                if (data?.deleteProduct) {
                    showMessage(`✅ Product "${productTitle}" deleted successfully!`, 'success');
                    await loadProducts();
                }
                
            } catch (error) {
                showMessage('Failed to delete product: ' + error.message, 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('addProductForm').addEventListener('submit', addProduct);
            loadProducts();
        });
    </script>
</body>
</html>
