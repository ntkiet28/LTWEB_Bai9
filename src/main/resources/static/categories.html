<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories Management - BTGraphQL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/BTGraphQL/">🚀 BTGraphQL</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/BTGraphQL/">Home</a>
                <a class="nav-link" href="/BTGraphQL/users-html">Users</a>
                <a class="nav-link active" href="/BTGraphQL/categories-html">Categories</a>
                <a class="nav-link" href="/BTGraphQL/products-html">Products</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2>📂 Categories Management</h2>
                
                <div class="card mb-4">
                    <div class="card-body">
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                            ➕ Add Category
                        </button>
                        <button class="btn btn-success" onclick="loadCategories()">
                            🔄 Refresh
                        </button>
                    </div>
                </div>

                <div id="loading" class="text-center" style="display: none;">
                    <div class="spinner-border" role="status"></div>
                    <p>Loading categories...</p>
                </div>

                <div id="messages"></div>

                <div class="card">
                    <div class="card-body">
                        <div id="categoriesTable">
                            <p class="text-muted">Click "Refresh" to load categories</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Category Modal -->
    <div class="modal fade" id="addCategoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="addCategoryForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="categoryName" class="form-label">Category Name *</label>
                            <input type="text" class="form-control" id="categoryName" required>
                        </div>
                        <div class="mb-3">
                            <label for="categoryImages" class="form-label">Image URL</label>
                            <input type="url" class="form-control" id="categoryImages">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">💾 Save Category</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const CONTEXT_PATH = '/BTGraphQL';
        
        async function executeGraphQL(query, variables = {}) {
            try {
                const response = await fetch(`${CONTEXT_PATH}/graphql`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, variables })
                });
                
                const result = await response.json();
                if (result.errors) throw new Error(result.errors[0].message);
                return result.data;
            } catch (error) {
                console.error('GraphQL Error:', error);
                throw error;
            }
        }

        function showMessage(message, type = 'info') {
            const messagesDiv = document.getElementById('messages');
            const alertClass = type === 'error' ? 'alert-danger' : 'alert-success';
            messagesDiv.innerHTML = `<div class="alert ${alertClass} alert-dismissible fade show" role="alert">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>`;
            setTimeout(() => messagesDiv.innerHTML = '', 5000);
        }

        async function loadCategories() {
            try {
                document.getElementById('loading').style.display = 'block';
                
                const query = `
                    query {
                        categories {
                            id
                            name
                            images
                            users { fullname }
                        }
                    }
                `;
                
                const data = await executeGraphQL(query);
                displayCategories(data.categories || []);
                
            } catch (error) {
                showMessage('Failed to load categories: ' + error.message, 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayCategories(categories) {
            if (!categories || categories.length === 0) {
                document.getElementById('categoriesTable').innerHTML = `
                    <div class="alert alert-info">
                        <h5>📭 No categories found</h5>
                        <p>Click "Add Category" to create your first category.</p>
                    </div>
                `;
                return;
            }
            
            let html = `
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>📂 Name</th>
                            <th>🖼️ Image</th>
                            <th>👥 Users Count</th>
                            <th>⚡ Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            categories.forEach(category => {
                const name = category.name || 'N/A';
                const image = category.images || 'N/A';
                const usersCount = (category.users && Array.isArray(category.users)) ? category.users.length : 0;
                
                html += `
                    <tr>
                        <td><strong>${name}</strong></td>
                        <td>${image !== 'N/A' ? `<img src="${image}" alt="${name}" style="width: 50px; height: 50px; object-fit: cover;">` : 'No image'}</td>
                        <td><span class="badge bg-primary">${usersCount} users</span></td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="deleteCategory('${category.id}', '${name}')">
                                🗑️ Delete
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            document.getElementById('categoriesTable').innerHTML = html;
        }

        async function addCategory(event) {
            event.preventDefault();
            
            try {
                const name = document.getElementById('categoryName').value.trim();
                const images = document.getElementById('categoryImages').value.trim() || null;
                
                if (!name) {
                    showMessage('Please enter category name!', 'error');
                    return;
                }
                
                const mutation = `
                    mutation($input: CategoryInput!) {
                        createCategory(input: $input) {
                            id
                            name
                            images
                        }
                    }
                `;
                
                const data = await executeGraphQL(mutation, {
                    input: { name, images }
                });
                
                if (data?.createCategory) {
                    showMessage(`✅ Category "${data.createCategory.name}" created successfully!`, 'success');
                    bootstrap.Modal.getInstance(document.getElementById('addCategoryModal')).hide();
                    document.getElementById('addCategoryForm').reset();
                    await loadCategories();
                }
                
            } catch (error) {
                showMessage('Failed to create category: ' + error.message, 'error');
            }
        }

        async function deleteCategory(categoryId, categoryName) {
            if (!confirm(`Are you sure you want to delete "${categoryName}"?`)) return;
            
            try {
                const mutation = `
                    mutation($id: ID!) {
                        deleteCategory(id: $id)
                    }
                `;
                
                const data = await executeGraphQL(mutation, { id: categoryId });
                
                if (data?.deleteCategory) {
                    showMessage(`✅ Category "${categoryName}" deleted successfully!`, 'success');
                    await loadCategories();
                }
                
            } catch (error) {
                showMessage('Failed to delete category: ' + error.message, 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('addCategoryForm').addEventListener('submit', addCategory);
            loadCategories();
        });
    </script>
</body>
</html>
