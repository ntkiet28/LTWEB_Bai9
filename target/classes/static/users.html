<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Management - BTGraphQL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .loading-spinner {
            display: none;
            text-align: center;
            margin: 20px;
        }
        .error-message {
            color: #dc3545;
            margin: 10px 0;
        }
        .success-message {
            color: #198754;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/BTGraphQL/">🚀 BTGraphQL</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/BTGraphQL/">Home</a>
                <a class="nav-link active" href="/BTGraphQL/users-html">Users</a>
                <a class="nav-link" href="/BTGraphQL/categories-html">Categories</a>
                <a class="nav-link" href="/BTGraphQL/products-html">Products</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2>👥 Users Management</h2>
                
                <!-- Controls -->
                <div class="card mb-4">
                    <div class="card-body">
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
                            ➕ Add User
                        </button>
                        <button class="btn btn-success" onclick="loadUsers()">
                            🔄 Refresh
                        </button>
                        <button class="btn btn-info" onclick="testAPI()">
                            🧪 Test API
                        </button>
                    </div>
                </div>

                <!-- Loading Spinner -->
                <div id="loading" class="loading-spinner">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p>Loading users...</p>
                </div>

                <!-- Messages -->
                <div id="messages"></div>

                <!-- Users Table -->
                <div class="card">
                    <div class="card-body">
                        <div id="usersTable">
                            <p class="text-muted">Click "Refresh" to load users</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="addUserForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="userFullname" class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="userFullname" required>
                        </div>
                        <div class="mb-3">
                            <label for="userEmail" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="userEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="userPassword" class="form-label">Password *</label>
                            <input type="password" class="form-control" id="userPassword" required>
                        </div>
                        <div class="mb-3">
                            <label for="userPhone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="userPhone">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">💾 Save User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const CONTEXT_PATH = '/BTGraphQL';
        
        // GraphQL Helper Function
        async function executeGraphQL(query, variables = {}) {
            try {
                console.log('🚀 Executing GraphQL:', query, variables);
                
                const response = await fetch(`${CONTEXT_PATH}/graphql`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        variables: variables
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                console.log('📄 GraphQL result:', result);
                
                if (result.errors) {
                    console.error('❌ GraphQL Errors:', result.errors);
                    throw new Error(result.errors[0].message);
                }
                
                return result.data;
            } catch (error) {
                console.error('💥 GraphQL Error:', error);
                throw error;
            }
        }

        // Show messages
        function showMessage(message, type = 'info') {
            const messagesDiv = document.getElementById('messages');
            const alertClass = type === 'error' ? 'alert-danger' : 'alert-success';
            messagesDiv.innerHTML = `<div class="alert ${alertClass} alert-dismissible fade show" role="alert">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>`;
            
            setTimeout(() => {
                messagesDiv.innerHTML = '';
            }, 5000);
        }

        // Load all users
        async function loadUsers() {
            try {
                document.getElementById('loading').style.display = 'block';
                
                const query = `
                    query {
                        users {
                            id
                            fullname
                            email
                            phone
                            categories {
                                name
                            }
                            products {
                                title
                            }
                        }
                    }
                `;
                
                const data = await executeGraphQL(query);
                displayUsers(data.users || []);
                
            } catch (error) {
                console.error('Error loading users:', error);
                showMessage('Failed to load users: ' + error.message, 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Display users in table
        function displayUsers(users) {
            console.log('👥 Displaying users:', users);
            
            if (!users || users.length === 0) {
                document.getElementById('usersTable').innerHTML = `
                    <div class="alert alert-info">
                        <h5>📭 No users found</h5>
                        <p>Click "Add User" to create your first user.</p>
                    </div>
                `;
                return;
            }
            
            let html = `
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>👤 Full Name</th>
                            <th>📧 Email</th>
                            <th>📱 Phone</th>
                            <th>📂 Categories</th>
                            <th>🛍️ Products</th>
                            <th>⚡ Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            users.forEach(user => {
                const fullname = user.fullname || 'N/A';
                const email = user.email || 'N/A';
                const phone = user.phone || 'N/A';
                const categories = (user.categories && Array.isArray(user.categories)) 
                    ? user.categories.map(cat => cat.name).join(', ') || 'None'
                    : 'None';
                const productsCount = (user.products && Array.isArray(user.products)) 
                    ? user.products.length 
                    : 0;
                
                html += `
                    <tr>
                        <td><strong>${fullname}</strong></td>
                        <td>${email}</td>
                        <td>${phone}</td>
                        <td><span class="badge bg-secondary">${categories}</span></td>
                        <td><span class="badge bg-primary">${productsCount} items</span></td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="deleteUser('${user.id}', '${fullname}')">
                                🗑️ Delete
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
            `;
            
            document.getElementById('usersTable').innerHTML = html;
        }

        // Add user
        async function addUser(event) {
            event.preventDefault();
            
            try {
                const fullname = document.getElementById('userFullname').value.trim();
                const email = document.getElementById('userEmail').value.trim();
                const password = document.getElementById('userPassword').value.trim();
                const phone = document.getElementById('userPhone').value.trim() || null;
                
                if (!fullname || !email || !password) {
                    showMessage('Please fill in all required fields!', 'error');
                    return;
                }
                
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    showMessage('Please enter a valid email address!', 'error');
                    return;
                }
                
                const mutation = `
                    mutation($input: UserInput!) {
                        createUser(input: $input) {
                            id
                            fullname
                            email
                            phone
                        }
                    }
                `;
                
                const variables = {
                    input: { fullname, email, password, phone }
                };
                
                const data = await executeGraphQL(mutation, variables);
                
                if (data && data.createUser) {
                    showMessage(`✅ User "${data.createUser.fullname}" created successfully!`, 'success');
                    bootstrap.Modal.getInstance(document.getElementById('addUserModal')).hide();
                    document.getElementById('addUserForm').reset();
                    await loadUsers();
                } else {
                    throw new Error('Failed to create user - no data returned');
                }
                
            } catch (error) {
                console.error('Error creating user:', error);
                showMessage('Failed to create user: ' + error.message, 'error');
            }
        }

        // Delete user
        async function deleteUser(userId, userName) {
            if (!confirm(`Are you sure you want to delete "${userName}"?`)) {
                return;
            }
            
            try {
                const mutation = `
                    mutation($id: ID!) {
                        deleteUser(id: $id)
                    }
                `;
                
                const data = await executeGraphQL(mutation, { id: userId });
                
                if (data && data.deleteUser) {
                    showMessage(`✅ User "${userName}" deleted successfully!`, 'success');
                    await loadUsers();
                } else {
                    throw new Error('Failed to delete user - no confirmation returned');
                }
                
            } catch (error) {
                console.error('Error deleting user:', error);
                showMessage('Failed to delete user: ' + error.message, 'error');
            }
        }

        // Test API
        async function testAPI() {
            try {
                showMessage('🧪 Testing API connections...', 'info');
                
                // Test REST endpoint
                const response = await fetch(`${CONTEXT_PATH}/test/status`);
                const status = await response.json();
                console.log('🔗 REST API Status:', status);
                
                // Test GraphQL endpoint
                const query = `query { users { id fullname email } }`;
                const graphqlData = await executeGraphQL(query);
                console.log('🔗 GraphQL Status:', graphqlData);
                
                showMessage('✅ API connections are working! Check console for details.', 'success');
                
            } catch (error) {
                console.error('API test error:', error);
                showMessage('❌ API test failed: ' + error.message, 'error');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Users Management page loaded');
            
            // Add form submit handler
            document.getElementById('addUserForm').addEventListener('submit', addUser);
            
            // Load users on page load
            loadUsers();
        });
    </script>
</body>
</html>
